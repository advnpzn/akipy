name: CI

'on':
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev pytest pytest-asyncio pytest-mock pytest-cov pytest-httpx

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=akipy --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev ruff

      - name: Run Ruff linter
        run: |
          uv run ruff check .

      - name: Run Ruff formatter check
        run: |
          uv run ruff format --check .

  integration-test:
    name: Integration Tests (live API + challenge solver)
    runs-on: ubuntu-latest
    needs: test
    # Requires secret AKIPY_SOLVER_URL (preferred) or AKIPY_FLARESOLVERR_URL.
    # Accepts any FlareSolverr v2-compatible service (FlareSolverr, TRAWL, etc.).
    # Fork PRs without secrets skip (see step below).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev pytest pytest-asyncio pytest-mock pytest-cov pytest-httpx

      - name: Run integration tests against live Akinator API
        env:
          # From GitHub Actions secrets; do not hardcode the URL in the repo.
          AKIPY_SOLVER_URL: ${{ secrets.AKIPY_SOLVER_URL }}
          AKIPY_FLARESOLVERR_URL: ${{ secrets.AKIPY_FLARESOLVERR_URL }}
        run: |
          SOLVER_URL="${AKIPY_SOLVER_URL:-$AKIPY_FLARESOLVERR_URL}"
          if [ -z "$SOLVER_URL" ]; then
            echo "AKIPY_SOLVER_URL (or AKIPY_FLARESOLVERR_URL) secret is not set; skipping integration tests."
            echo "Add the secret in repo Settings → Secrets and variables → Actions."
            exit 0
          fi
          export AKIPY_SOLVER_URL="$SOLVER_URL"
          uv run pytest -m integration -v --no-cov
        timeout-minutes: 20

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev mypy

      - name: Run mypy
        run: |
          uv run mypy akipy --ignore-missing-imports
        continue-on-error: true
