name: CI

'on':
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev pytest pytest-asyncio pytest-mock pytest-cov pytest-httpx

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=akipy --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev ruff

      - name: Run Ruff linter
        run: |
          uv run ruff check .

      - name: Run Ruff formatter check
        run: |
          uv run ruff format --check .

  integration-test:
    name: Integration Tests (live API + challenge solver)
    runs-on: ubuntu-latest
    needs: test
    # Always use FlareSolverr as a service on the runner. Public remote solvers
    # (e.g. behind Cloudflare) often return 403 to GitHub Actions IPs, so secrets
    # are not used here. For local runs, set AKIPY_SOLVER_URL yourself.

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --shm-size=2gb
          --health-cmd "curl -f http://localhost:8191/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev pytest pytest-asyncio pytest-mock pytest-cov pytest-httpx

      - name: Wait for FlareSolverr service
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://127.0.0.1:8191/ >/dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            echo "waiting for FlareSolverr ($i)..."
            sleep 5
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Run integration tests against live Akinator API
        env:
          AKIPY_SOLVER_URL: http://127.0.0.1:8191
        run: uv run pytest -m integration -v --no-cov
        timeout-minutes: 20

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev mypy

      - name: Run mypy
        run: |
          uv run mypy akipy --ignore-missing-imports
        continue-on-error: true
